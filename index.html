<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árbol de metas</title>
<style>
:root{--bg:#1a1f25;--stone:#232a31;--edge:#3b4550;--ink:#e9eef3;--muted:#8e9aa6;--glow:#cfe3ff;--gold:#d9b25f}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh;
background:radial-gradient(ellipse at 40% 30%,#2b333c 0%,#1a1f25 55%,#111418 100%)}
.top{display:flex;align-items:center;gap:6px;padding:10px 16px;background:#14181d;border-bottom:1px solid #2f3842;overflow-x:auto}
.tab{padding:8px 14px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border:1px solid var(--gold);border-bottom:none;background:linear-gradient(#2a2418,#1a1f25)}
.xp{margin-left:auto;font-size:.8rem;color:var(--ink);white-space:nowrap;display:flex;gap:14px;align-items:center;line-height:1}
.xp>*{display:inline-flex;align-items:center}
.xp b{color:var(--gold)}
.main{display:grid;grid-template-columns:1fr 320px;column-gap:56px;row-gap:0;max-width:1150px;margin:0 auto;padding:18px 16px 30px}
.title{text-align:center;letter-spacing:.2em;text-transform:uppercase;font-size:1rem;margin:4px 0 2px}
.title:after{content:"";display:block;width:220px;height:1px;margin:8px auto 0;background:linear-gradient(90deg,transparent,#8e9aa6,transparent)}
.tree{position:relative;aspect-ratio:1/1;max-height:78vh;margin:40px auto 0;width:100%}
.tree svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ln{stroke:#55616d;stroke-width:3;fill:none;vector-effect:non-scaling-stroke}
.ln.lit{stroke:#f6e3ad;filter:drop-shadow(0 0 3px #f0cd78)}
.syn{stroke-dasharray:5 6;stroke-width:2}
.col{position:absolute;top:0;transform:translateX(-50%);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.yr{position:absolute;left:0;transform:translateY(-50%);font-size:.7rem;color:#5d6976;letter-spacing:.1em}
.node{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%) rotate(45deg);
background:var(--stone);border:2px solid var(--edge);cursor:pointer;transition:all .25s;outline-offset:4px}
.node i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(-45deg);font-size:24px;color:#5d6976;transition:color .25s}
.node:hover{border-color:#9aa8b6}
.node.active{border-color:#dbe8f7;box-shadow:0 0 10px rgba(207,227,255,.45)}
.node.active i{color:#dbe8f7}
.node.done{border-color:#fff4d2;background:radial-gradient(circle,#8a7442 0%,#4a3d22 55%,#2a2416 100%);box-shadow:0 0 6px #fff1c4,0 0 18px rgba(240,205,120,.85),0 0 32px rgba(240,205,120,.4),inset 0 0 14px rgba(255,236,180,.55)}
.node.done i{color:#fffaf0;filter:drop-shadow(0 0 4px #ffe8a8)}
.node.ult{width:66px;height:66px;box-shadow:0 0 0 4px #1a1f25,0 0 0 6px var(--edge)}
.node.ult.active{box-shadow:0 0 0 4px #1a1f25,0 0 0 6px #dbe8f7,0 0 14px rgba(207,227,255,.5)}
.node.ult.done{border-color:#fff4d2;background:radial-gradient(circle,#9a8248 0%,#4a3d22 55%,#2a2416 100%);box-shadow:0 0 0 4px #1a1f25,0 0 0 6px #f0cd78,0 0 22px rgba(240,205,120,.9),0 0 40px rgba(240,205,120,.45),inset 0 0 16px rgba(255,236,180,.6)}
.node.ult.done i{color:#fffaf0;filter:drop-shadow(0 0 5px #ffe8a8)}
.node.sel{outline:2px solid var(--gold)}
.title{grid-column:1;grid-row:1}.tree{grid-column:1;grid-row:2}
.panel{grid-column:2;grid-row:2;margin-top:40px;background:#171b20;border:1px solid #33404b;align-self:start;position:sticky;top:12px}
.panel h2{margin:0;padding:12px 14px;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;border-bottom:1px solid #33404b}
.art{height:170px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#2f3842 0%,#171b20 75%);border-bottom:1px solid #33404b}
.art img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) brightness(.9)}
.art:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(0,0,0,.6);pointer-events:none}
.art i{font-size:72px;color:#dbe8f7;filter:drop-shadow(0 0 10px rgba(207,227,255,.5))}
.desc{padding:12px 14px;font-size:.88rem;line-height:1.5;color:#c9d2db;border-bottom:1px solid #33404b}
.state{padding:8px;text-align:center;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid #33404b}
.sub{padding:8px 14px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;border-bottom:1px solid #33404b;color:var(--muted)}
.extra{padding:10px 14px;font-size:.84rem;color:#c9d2db;border-bottom:1px solid #33404b}
.req{padding:10px 14px;font-size:.8rem;display:flex;justify-content:space-between;color:var(--muted)}
.req b{color:#e2707a}.req b.ok{color:#7fd6a5}
.btn{display:block;width:calc(100% - 28px);margin:4px 14px 14px;padding:9px;background:#252c34;color:var(--ink);border:1px solid #55616d;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.foot{display:flex;justify-content:flex-end;gap:18px;padding:0 16px 16px;max-width:1150px;margin:0 auto;font-size:.75rem;color:var(--muted);letter-spacing:.08em}
@media (max-width:820px){.main{grid-template-columns:1fr}.panel{position:static;grid-column:1;grid-row:3}}
.sync{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.sync.ok{color:#7fd6a5}.sync.err{color:#e2707a}
.ghbtn{background:#252c34;color:var(--ink);border:1px solid #55616d;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;cursor:pointer;font-family:inherit}
.ghbtn:hover{border-color:var(--gold)}
.ghmodal{position:fixed;inset:0;z-index:50;background:rgba(8,10,13,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.ghmodal[hidden]{display:none}
.ghbox{width:min(460px,100%);background:#171b20;border:1px solid #55616d;box-shadow:0 0 0 4px #1a1f25,0 0 0 5px #3b4550,0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px;padding:20px;font-size:.85rem;color:#c9d2db}
.ghbox h3{margin:0;text-align:center;font-size:.9rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.ghbox p{margin:0;line-height:1.5}
.ghrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ghbox input{width:100%;background:#111418;border:1px solid #55616d;color:var(--ink);padding:7px 9px;font-family:monospace}
</style>

  if(r.status===404){ghSha=null;setSync('Conectado a GitHub','ok');if(Object.keys(done).length)ghPush('Primer guardado del progreso');return}
  if(!r.ok)throw new Error(r.status===401?'Token no válido':'Error '+r.status);
  const j=await r.json();ghSha=j.sha;done=Object.assign({},JSON.parse(b64d(j.content)).done||{});
  try{localStorage.setItem('arbolMetasV2',JSON.stringify(done))}catch(e){}
  render();setSync('Sincronizado con GitHub','ok');
 }catch(e){setSync('GitHub: '+e.message,'err')}}
async function ghPush(msg,retry){
 if(!ghToken)return;setSync('Guardando en GitHub…');
 const body={message:msg,branch:GH.branch,content:b64e(JSON.stringify({done,actualizado:new Date().toISOString()},null,2))};
 if(ghSha)body.sha=ghSha;
 try{const r=await fetch(ghUrl(),{method:'PUT',headers:ghHead(),body:JSON.stringify(body)});
  if((r.status===409||r.status===422)&&!retry){const g=await fetch(ghUrl()+'?ref='+GH.branch+'&t='+Date.now(),{headers:ghHead(),cache:'no-store'});ghSha=g.ok?(await g.json()).sha:null;return ghPush(msg,1)}
  if(!r.ok)throw new Error(r.status===401?'Token no válido':'Error '+r.status);
  ghSha=(await r.json()).content.sha;setSync('Guardado en GitHub','ok');
 }catch(e){setSync('No se pudo guardar: '+e.message,'err')}}
function save(msg){try{localStorage.setItem('arbolMetasV2',JSON.stringify(done))}catch(e){}
 if(!ghToken)return;clearTimeout(ghTimer);setSync('Cambios pendientes…');ghTimer=setTimeout(()=>ghPush(msg),1500)}
const ghBox=document.getElementById('ghBox');
const ghClose=()=>{ghBox.hidden=true;document.getElementById('ghBtn').focus()};
document.getElementById('ghBtn').onclick=()=>{document.getElementById('ghState').textContent=ghToken?'Conectado. Puedes pegar un token nuevo o desconectar.':'Pega un token con acceso solo a goal_tree y permiso Contents de lectura y escritura.';
 document.getElementById('ghOff').hidden=!ghToken;ghBox.hidden=false;document.getElementById('ghToken').focus()};
document.getElementById('ghCancel').onclick=ghClose;
ghBox.addEventListener('click',e=>{if(e.target===ghBox)ghClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ghBox.hidden)ghClose()});
document.getElementById('ghSave').onclick=()=>{const v=document.getElementById('ghToken').value.trim();if(!v){setSync('Pega un token primero','err');return}
 ghToken=v;try{localStorage.setItem('goalTreeToken',v)}catch(e){}document.getElementById('ghToken').value='';document.getElementById('ghBox').hidden=true;ghLoad()};
document.getElementById('ghOff').onclick=()=>{ghToken='';ghSha=null;try{localStorage.removeItem('goalTreeToken')}catch(e){}document.getElementById('ghBox').hidden=true;setSync('Solo en este navegador')};
let sel='a1';
const tree=document.getElementById('tree'),lines=document.getElementById('lines');

function state(n){if(done[n.id])return 'done';if(n.start||(n.req||[]).every(r=>done[r]))return 'active';return 'locked'}
function render(){
 tree.querySelectorAll('.node,.col,.yr').forEach(e=>e.remove());lines.innerHTML='';
 for(const b in X){const c=document.createElement('div');c.className='col';c.style.left=X[b]+'%';c.textContent=NAME[b];tree.appendChild(c)}
 for(const y in Y){const c=document.createElement('div');c.className='yr';c.style.top=Y[y]+'%';c.textContent=y;tree.appendChild(c)}
 const L=(x1,y1,x2,y2,cls)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1} ${y1} L${x2} ${y2}`);p.setAttribute('class',cls);lines.appendChild(p)};
 N.forEach(n=>(n.req||[]).forEach(r=>{const a=byId[r];L(px(a),Y[a.y],px(n),Y[n.y],'ln'+(done[r]?' lit':''))}));
 SYN.forEach(([a,b])=>{const A=byId[a],B=byId[b];const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  const my=(Y[A.y]+Y[B.y])/2;p.setAttribute('d',`M${px(A)} ${Y[A.y]} C${px(A)} ${my} ${px(B)} ${my} ${px(B)} ${Y[B.y]}`);
  p.setAttribute('class','ln syn'+(done[a]?' lit':''));lines.appendChild(p)});
 N.forEach(n=>{const d=document.createElement('button');d.className=`node ${state(n)} ${n.ult?'ult':''} ${sel===n.id?'sel':''}`;
  d.style.left=px(n)+'%';d.style.top=Y[n.y]+'%';d.setAttribute('aria-label',n.t);d.innerHTML=`<i>${svgI(n.id,n.ult?28:24)}</i>`;
  d.onclick=()=>{sel=n.id;render()};tree.appendChild(d)});
 document.getElementById('xp').textContent=`${Object.keys(done).length} / ${N.length}`;
 panel(byId[sel]);
}
function panel(n){
 const st=state(n),lab={done:'Completado',active:'Disponible',locked:'Bloqueado'}[st];
 const syn=SYN.filter(s=>s[0]===n.id||s[1]===n.id).map(s=>`${s[2]} (${byId[s[0]===n.id?s[1]:s[0]].t})`);
 const req=(n.req||[]).map(r=>byId[r]);const ok=req.every(r=>done[r.id]);
 document.getElementById('panel').innerHTML=`<h2>${n.t}</h2><div class="art">${photoI(n.id)}</div><div class="sub">Runa ${ICON[n.id][1]} · ${ICON[n.id][2]}</div>
 <div class="desc">${n.d}</div><div class="state" style="color:${st==='done'?'#7fd6a5':st==='active'?'#dbe8f7':'#8e9aa6'}">${lab} · ${NAME[n.b]} · ${n.y}</div>
 ${n.sc?`<div class="sub">Objetivo a final de año</div><div class="extra">${n.sc.map((x,i)=>`<div style="margin-bottom:6px">${x[0]}<br><b style="color:${['#c9d2db','#9cc4ff','#7fd6a5','#f0cd78'][i]||'#c9d2db'}">${x[1]}</b></div>`).join('')}</div>`:''}
 <div class="sub">Sinergia</div><div class="extra">${syn.length?syn.join('<br>'):'Ninguna directa'}</div>
 <div class="req"><span>Requiere ${req.length?req.map(r=>r.t).join(', '):'nada'}</span><b class="${ok?'ok':''}">${req.length?(ok?'✓':'✗'):'✓'}</b></div>
 ${st==='locked'?'':`<button class="btn" id="tog">${done[n.id]?'Deshacer':'Marcar como completado'}</button>`}`;
 const t=document.getElementById('tog');if(t)t.onclick=()=>{const was=done[n.id];if(was)delete done[n.id];else done[n.id]=1;render();save((was?'Deshace: ':'Completa: ')+n.t)};
}
render();ghLoad();
</script>
</body>
</html>
